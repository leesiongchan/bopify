name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install release tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: '2026.10.21'
          install_args: aqua:orhun/git-cliff
      - name: Plan app release
        id: plan
        run: ./scripts/plan-release.sh build/release/notes.md
      - name: Upload release notes
        if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: build/release/notes.md
          if-no-files-found: error
          overwrite: true

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/ci.xcconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Identify build environment
        id: build-env
        run: echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Install build tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: '2026.10.21'
          cache_key: "{{default}}-${{ steps.build-env.outputs.xcode }}-${{ hashFiles('rust-toolchain.toml') }}"
      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.build-env.outputs.xcode }}-${{ hashFiles('scripts/build-rust.sh', 'scripts/test-native.sh', '.cargo/config.toml') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET
          cache-bin: false
      - name: Cache native framework
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/BopifyCoreFFI.xcframework
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ steps.build-env.outputs.xcode }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rust/cbindgen.toml', 'rust/crates/**', 'rust-toolchain.toml', '.cargo/config.toml', 'mise.toml', 'scripts/build-rust.sh') }}
      - name: Cache Xcode compilations
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: xcode-cas-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-env.outputs.xcode }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xcode-cas-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-env.outputs.xcode }}-
      - name: Test native playback
        run: ./scripts/test-native.sh
      - name: Build native framework
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-rust.sh
      - name: Test Swift packages
        run: swift test --package-path Packages/BopifyCore
      - name: Test macOS app
        run: >-
          xcodebuild -project Bopify/Bopify.xcodeproj -scheme BopifyAppTests
          -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO test
      - name: Package ad-hoc DMG
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: ./scripts/release.sh "$RELEASE_VERSION" --skip-rust-build
      - name: Upload verified DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-dmg
          path: build/release/Bopify-${{ needs.plan.outputs.version }}.dmg
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    needs: [plan, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        # A stale re-run must not publish: a newer release already contains these commits.
        # gh drafts the release, uploads the DMG, then publishes; it deletes the draft on failure.
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          if [[ $(printf '%s\n' "$latest" "$TAG" | sort -V | tail -n 1) != "$TAG" ]]; then
            echo "$latest is newer than $TAG; refusing to publish a stale release." >&2
            exit 1
          fi
          gh release create "$TAG" "release/Bopify-$VERSION.dmg" \
            --target "$GITHUB_SHA" --title "Bopify $VERSION" --notes-file release/notes.md
