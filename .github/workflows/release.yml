name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.version_tag }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate release version
        id: version
        uses: PaulHatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          branch: ${{ github.sha }}
          bump_each_commit: true
          major_pattern: '/^[a-z]+(\([^)]+\))?!:|^BREAKING[ -]CHANGE:/'
          major_regexp_flags: m
          minor_pattern: '/^feat(\([^)]+\))?:/'
          minor_regexp_flags: m
          search_commit_body: true
          enable_prerelease_mode: false
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Package ad-hoc DMG
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release.sh "$RELEASE_VERSION"
      - name: Test native playback
        run: ./scripts/test-native.sh
      - name: Test Swift packages
        run: swift test --package-path Packages/BopifyCore
      - name: Test macOS app
        run: >-
          xcodebuild -project Bopify/Bopify.xcodeproj -scheme BopifyAppTests
          -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO test
      - name: Upload verified DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-dmg
          path: build/release/Bopify-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-dmg
          path: release
      - name: Upload release draft
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.build.outputs.tag }}
          commit: ${{ github.sha }}
          name: Bopify ${{ needs.build.outputs.version }}
          artifacts: release/Bopify-${{ needs.build.outputs.version }}.dmg
          artifactErrorsFailBuild: true
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          skipIfReleaseExists: true
          replacesArtifacts: true
          makeLatest: 'false'
          generateReleaseNotes: true
          body: |
            This release is ad-hoc signed and is not notarized by Apple.

            After copying Bopify to Applications, try opening it. If macOS blocks it and you trust this download, use System Settings > Privacy & Security > Open Anyway.

            [Apple installation instructions](https://support.apple.com/en-us/102445)
      - name: Publish release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.build.outputs.tag }}
          commit: ${{ github.sha }}
          draft: false
          allowUpdates: true
          updateOnlyUnreleased: true
          skipIfReleaseExists: true
          omitBody: true
          omitName: true
          omitPrereleaseDuringUpdate: true
          makeLatest: legacy
