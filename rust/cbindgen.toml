language = "C"
include_guard = "BOPIFY_CORE_H"
autogen_warning = "/* Generated by scripts/build-rust.sh. Do not edit. */"
header = """
/*
 * Contract for every entry point in this header:
 *
 *  - bopify_services_create and bopify_services_destroy BLOCK. Create performs
 *    network login; destroy joins every Rust runtime worker. Call both away
 *    from the main thread.
 *  - These services only retrieve radio, lyrics and artist metadata.
 *  - The event callback runs on a Rust runtime thread. JSON buffers are
 *    borrowed and valid only during the callback.
 *  - `ctx` must be usable when create is called and stay alive until destroy
 *    returns. Once destroy returns, no further callback can occur.
 *  - Destroy is idempotent and may run concurrently with every entry point.
 *    Every concurrent destroy waits for teardown. The handle remains allocated
 *    as a tombstone; later requests return SessionLost (-2).
 *  - Do NOT issue a request or destroy the same handle from inside a callback.
 *    Dispatch to your own queue first: a runtime worker cannot wait on its own
 *    teardown or a lock held by the thread joining it.
 *  - Requests return 0 when enqueued or a negative BopifyError code. Observe
 *    the reply event carrying the request ID for the eventual result.
 *  - `expected_username` is required: nonblank UTF-8, at most 256 bytes, with
 *    no control characters. Login verifies an exact authenticated username
 *    match; mismatches shut down the session and return AuthInvalid (-3).
 *  - String arguments are borrowed only for the duration of the call.
 */
"""

[export]
include = ["BopifyServices"]
# BopifyError never crosses the ABI as a type -- only its i32 code does -- but
# cbindgen would otherwise emit it as an unusable opaque struct. Excluding it
# costs a "Can't find BopifyError" warning per reference, which is expected.
exclude = ["BopifyError"]
