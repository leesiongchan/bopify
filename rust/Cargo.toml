[workspace]
members = ["crates/bopify-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

# Pinned deliberately: librespot has no stable released API. Upgrading is
# a decision, not a side effect of a build.
# Source: https://github.com/librespot-org/librespot.git
# Revision: 939dc5ee9d833e1980f9495241219d9d4868a061
# Run ../scripts/prepare-librespot.sh before Cargo on a fresh checkout.
[workspace.dependencies]
librespot-core = { path = "../.build/librespot-939dc5e/core" }
librespot-playback = { path = "../.build/librespot-939dc5e/playback" }
librespot-connect = { path = "../.build/librespot-939dc5e/connect" }
librespot-metadata = { path = "../.build/librespot-939dc5e/metadata" }
