[workspace]
members = ["crates/bopify-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

# Keep all librespot crates on the same reviewed commit of the Bopify fork.
[workspace.dependencies]
librespot-core = { git = "https://github.com/leesiongchan/librespot.git", rev = "80f49d50bf46ac454255f02c2fe0ed46ddf01fa6" }
librespot-playback = { git = "https://github.com/leesiongchan/librespot.git", rev = "80f49d50bf46ac454255f02c2fe0ed46ddf01fa6" }
librespot-connect = { git = "https://github.com/leesiongchan/librespot.git", rev = "80f49d50bf46ac454255f02c2fe0ed46ddf01fa6" }
librespot-metadata = { git = "https://github.com/leesiongchan/librespot.git", rev = "80f49d50bf46ac454255f02c2fe0ed46ddf01fa6" }
