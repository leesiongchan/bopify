[workspace]
members = ["crates/bopify-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

# Keep all librespot crates on the same reviewed commit of the Bopify fork.
[workspace.dependencies]
librespot-core = { git = "https://github.com/leesiongchan/librespot.git", rev = "ca57da76602366bd859aca7fe5e06b52a08b5811" }
librespot-playback = { git = "https://github.com/leesiongchan/librespot.git", rev = "ca57da76602366bd859aca7fe5e06b52a08b5811" }
librespot-connect = { git = "https://github.com/leesiongchan/librespot.git", rev = "ca57da76602366bd859aca7fe5e06b52a08b5811" }
librespot-metadata = { git = "https://github.com/leesiongchan/librespot.git", rev = "ca57da76602366bd859aca7fe5e06b52a08b5811" }
