[package]
name = "bopify-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
librespot-core.workspace = true
librespot-connect.workspace = true
librespot-metadata.workspace = true
librespot-playback = { workspace = true, features = ["rodio-backend"] }
# The facade librespot already logs through; a second framework would split
# the output.
log = "0.4"
# "time" and "net" are what the engine's own runtime needs from enable_all().
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Builds oslog_shim.c, the one C function that reaches os_log. See that file.
[build-dependencies]
cc = "1.4.7"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
