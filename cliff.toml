[changelog]
body = """
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group }}
{% for commit in entry.commits %}
- {{ commit.message | split(pat="\n") | first | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/leesiongchan/bopify/commit/{{ commit.id }}))
{% if commit.breaking_description %}
  **Upgrade:** {{ commit.breaking_description | replace(from="\n", to="\n  ") }}
{% endif %}
{% endfor %}
{% endfor %}
## Installation

This release is ad-hoc signed and is not notarized by Apple.

After copying Bopify to Applications, try opening it. If macOS blocks it and you trust this download, use System Settings > Privacy & Security > Open Anyway.

[Apple installation instructions](https://support.apple.com/en-us/102445)

[Full changelog](https://github.com/leesiongchan/bopify/compare/{{ previous.version }}...{{ version }})
"""
trim = true
postprocessors = [{ pattern = '\n{3,}', replace = "\n\n" }]

[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
include_paths = [
  "Bopify/Bopify/**",
  "Bopify/Bopify.xcodeproj/project.pbxproj",
  "Bopify/Bopify.xcodeproj/project.xcworkspace/**",
  "Packages/BopifyCore/Sources/**",
  "Packages/BopifyCore/Package.swift",
  "Packages/BopifyCore/Package.resolved",
  "rust/Cargo.toml",
  "rust/Cargo.lock",
  "rust/crates/**/Cargo.toml",
  "rust/crates/**/build.rs",
  "rust/crates/**/src/**",
  "rust/crates/**/oslog_shim.c",
  "rust/about.toml",
  "rust/about.hbs",
  "rust/cbindgen.toml",
  "rust-toolchain.toml",
  ".cargo/config.toml",
  "mise.toml",
  "scripts/build-rust.sh",
  "scripts/release.sh",
  "LICENSE",
]
commit_parsers = [
  { field = "breaking", pattern = "true", group = "Breaking changes" },
  { message = '^feat(\([^)]*\))?!?:', group = "Features" },
  { message = '^fix(\([^)]*\))?!?:', group = "Fixes" },
  { message = '^perf(\([^)]*\))?!?:', group = "Performance" },
  { message = '^revert(\([^)]*\))?!?:', group = "Changes" },
  { message = '^Revert "(feat|fix|perf|revert)', group = "Changes" },
  { message = "^(chore|ci|build|docs|style|test|refactor)(\\([^\\n]*\\))?:", skip = true },
  { message = ".*", skip = true },
]
